name: CI e deploy Cloudflare
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Verifica credenciais
        run: test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Configure os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Cria o D1 se não existir e grava o id no wrangler.jsonc
        run: node scripts/ensure-d1.mjs
      - run: npx vite build
      - run: npx wrangler d1 migrations apply nutrivida --remote
      - name: Segredo de cifragem (apenas na primeira vez)
        run: |
          if ! npx wrangler secret list | grep -q DATA_KEY; then openssl rand -base64 32 | npx wrangler secret put DATA_KEY; fi
      - run: npx wrangler deploy
